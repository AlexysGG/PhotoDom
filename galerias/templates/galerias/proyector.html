{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyector - {{ evento.nombre_evento }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: black;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        #proyector-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        #media-display {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        #mensaje-overlay {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.2rem;
            max-width: 80%;
            text-align: center;
            backdrop-filter: blur(10px);
            display: none;
            animation: fadeInUp 0.5s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translate(-50%, 20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }
        
        #qr-overlay {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        
        #qr-overlay img {
            width: 120px;
            height: 120px;
        }
        
        #qr-overlay p {
            color: #333;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            margin: 0;
        }
        
        #fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        #fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        #proyector-container:hover #fullscreen-btn {
            opacity: 1;
        }
        
        .nuevo-archivo-animation {
            animation: pulseHighlight 2s ease-out;
        }
        
        @keyframes pulseHighlight {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
            }
            70% {
                box-shadow: 0 0 0 20px rgba(255, 255, 255, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }
        }
        
        #loading-indicator {
            position: absolute;
            color: white;
            font-size: 1.5rem;
            display: block;
        }
    </style>
</head>
<body>
    <div id="proyector-container">
        <div id="loading-indicator">Cargando...</div>
        
        <img id="media-display" src="" alt="" style="display: none;">
        <video id="media-display-video" style="display: none; max-width: 100%; max-height: 100%; object-fit: contain;" muted autoplay></video>
        
        <div id="mensaje-overlay"></div>
        
        <button id="fullscreen-btn" onclick="toggleFullscreen()">
            ⛶ Pantalla Completa
        </button>
        
        <div id="qr-overlay">
            {% if qr_base64 %}
            <img src="data:image/png;base64,{{ qr_base64 }}" alt="Código QR">
            {% endif %}
            <p>¡Escanea el QR y comparte tus fotos!</p>
        </div>
    </div>

    <script>
        window.EVENTO_ID = "{{ evento.id }}";
        window.ARCHIVOS_INICIALES = [
            {% for archivo in archivos %}
            {% if archivo.estado_procesamiento == 'COMPLETADO' %}
            {
                id: {{ archivo.id }},
                url: "{% if usar_proxy %}/ver/{{ archivo.id }}/?modo=visualizacion{% else %}{% if archivo.preview_archivo %}{{ archivo.preview_archivo.url }}{% else %}{{ archivo.original_archivo.url }}{% endif %}{% endif %}",
                es_video: {% if archivo.es_video %}true{% else %}false{% endif %},
                mensaje: "{{ archivo.mensaje|default:''|escapejs }}",
                likes: {{ archivo.likes|default:0 }}
            }{% if not forloop.last %},{% endif %}
            {% endif %}
            {% empty %}
            {% endfor %}
        ];
    </script>
    <script src="{% static 'galerias/js/proyector.js' %}"></script>
</body>
</html>
