{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sin conexión — PhotoDom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'galerias/css/styles.css' %}" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="{% static 'favicon.svg' %}">
  <link rel="shortcut icon" href="{% static 'favicon.ico' %}">
  <link rel="manifest" href="/manifest.json">
</head>

<body>
  <!-- Header -->
  <header class="nav-header">
    <div class="container nav-container">
      <a href="{% url 'home' %}" class="nav__brand" aria-label="PhotoDom Inicio">
        <img src="{% static 'icon-512.png' %}" alt="PhotoDom" class="nav__brand-logo" width="34" height="34" />
        PhotoDom
      </a>
      <div class="nav__actions">
        <button type="button" onclick="window.location.reload();" class="button button--ghost nav__cta">Reintentar</button>
      </div>
    </div>
  </header>

  <main class="status-page">
    <div class="status-card">
      <div class="status-icon-bubble status-icon-bubble--primary">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"/>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <line x1="12" y1="20" x2="12.01" y2="20"/>
        </svg>
      </div>

      <h1 class="status-title">Sin conexión a internet</h1>
      <p class="status-desc">
        No se pudo establecer conexión con PhotoDom. Por favor verifica tus datos móviles o red Wi-Fi para continuar disfrutando de tu galería.
      </p>

      <div style="display: flex; gap: 0.85rem; justify-content: center; flex-wrap: wrap;">
        <button type="button" class="button button--primary" onclick="window.location.reload();">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
          Reintentar conexión
        </button>
        <button type="button" class="button button--ghost" onclick="history.back();">Regresar</button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-container">
      <div class="footer__brand">PhotoDom</div>
      <p style="font-size: 0.8rem; color: var(--text-muted);">&copy; 2026 PhotoDom. Modo Fuera de Línea.</p>
    </div>
  </footer>

  <script>
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
